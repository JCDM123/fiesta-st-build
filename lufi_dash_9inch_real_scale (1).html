// LED stages: 16 lights; start 3500, compressed toward shift
const LEDCOL=['#3c6eff','#3c6eff','#3c6eff','#3c6eff','#28c846','#28c846','#28c846','#28c846','#f0c81e','#f0c81e','#f0c81e','#f0c81e','#e12828','#e12828','#e12828','#ff1414'];
const LEDRPM=[3500,3750,4000,4250,4500,4720,4940,5160,5380,5560,5740,5900,6040,6160,6260,6340];
const SHIFT=6300, REV=6600;
let rpm=2200, gear=2, boost=0, t0=performance.now(), flashT=0;
function ital(px,w){x.font=w+' '+px+'px sans-serif';}
function drawLED(cx,cy,r,col,lit,glow){
  if(lit&&glow){x.save();x.shadowColor=col;x.shadowBlur=18;x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.restore();}
  x.fillStyle=lit?col:'rgba(60,60,66,.9)';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
  if(!lit){x.fillStyle='rgba(0,0,0,.72)';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
    x.fillStyle=col;x.globalAlpha=.16;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.globalAlpha=1;}
}
function frame(now){
  const dt=Math.min((now-t0)/1000,.05); t0=now;
  // simulate a pull
  const rate=(1900-(rpm-2000)*0.12)*(1+ (4-gear)*0.15);
  rpm+=rate*dt;
  if(rpm>=REV||(rpm>=SHIFT+180&&Math.random()<.02)){ // driver shifts just past flash
    gear++; if(gear>4){gear=2;rpm=2200;boost=0;} else rpm=Math.max(2400,rpm*0.62);
  }
  // boost model: builds with rpm+load
  const targ=rpm<2500?2:Math.min(21,(rpm-2400)/160+6);
  boost+=(targ-boost)*Math.min(1,dt*3.2);
  const afr=(rpm>3000? (12.2+Math.sin(now/300)*.15) : 14.7).toFixed(1);
  const spd=(gear*28+rpm/100).toFixed(0);
  // ---- draw ----
  x.fillStyle='#08080a';x.fillRect(0,0,960,544);
  // strip band
  x.fillStyle='#101013';rr(10,8,940,64,14);x.fill();
  const flash=rpm>=SHIFT&&(Math.floor(now/70)%2===0);
  for(let i=0;i<16;i++){
    const lx=26+21+i*((960-52-42)/15);
    const lit=flash?true:rpm>=LEDRPM[i];
    drawLED(lx,40,21,flash?'#ff1414':LEDCOL[i],lit,true);
  }
  // hero row
  ital(34,'bold italic');x.fillStyle=CYAN;x.fillText('BOOST',20,138);
  ital(62,'bold italic');x.fillStyle=WHITE;
  const bstr=(boost<0?'':'')+boost.toFixed(1);
  x.fillText(bstr,160+ (boost<10?38:0),146);
  ital(24,'italic');x.fillStyle=GREY;x.fillText('psi',330,146);
  ital(34,'bold italic');x.fillStyle=CYAN;x.fillText('AFR',430,138);
  ital(62,'bold italic');x.fillStyle=WHITE;x.fillText(afr,530,146);
  ital(24,'italic');x.fillStyle=GREY;x.fillText(':1',680,146);
  if(badge.complete)x.drawImage(badge,960-20-128,96,128,128*badge.height/badge.width);
  // bar
  const bx0=20,bx1=940,by=214,bh=26;
  x.fillStyle='#1e1e22';rr(bx0,by-bh,bx1-bx0,bh,8);x.fill();
  const fw=Math.max(10,(bx1-bx0)*Math.max(boost,0)/24);
  x.save();x.shadowColor=RED;x.shadowBlur=16;x.fillStyle=RED;rr(bx0,by-bh,fw,bh,8);x.fill();x.restore();
  x.fillStyle='#ff7878';x.fillRect(bx0+fw-2,by-bh+2,3,bh-4);
  // scale
  for(let i=0;i<=24;i++){
    const sx=bx0+(bx1-bx0)*i/24, maj=i%2===0;
    x.fillStyle=WHITE;
    x.beginPath();
    const wt=maj?4.8:3.4, wb=maj?2.6:1.9, ln=maj?15:10;
    x.moveTo(sx-wt,by+8);x.lineTo(sx+wt,by+8);x.lineTo(sx+wb,by+8+ln);x.lineTo(sx-wb,by+8+ln);x.fill();
  }
  x.strokeStyle=WHITE;x.lineWidth=5;
  for(let i=0;i<24;i++){const a=bx0+(bx1-bx0)*i/24+8,b=bx0+(bx1-bx0)*(i+1)/24-8;
    x.beginPath();x.moveTo(a,by+9);x.lineTo(b,by+9);x.stroke();}
  x.strokeStyle=RED;x.lineWidth=3;
  for(let i=0;i<24;i++){const a=bx0+(bx1-bx0)*i/24+10,b=bx0+(bx1-bx0)*(i+1)/24-10;
    x.beginPath();x.moveTo(a,by+19);x.lineTo(b,by+19);x.stroke();}
  ital(19,'bold italic');x.fillStyle=WHITE;x.textAlign='center';
  for(let i=0;i<=24;i+=2)x.fillText(i,bx0+(bx1-bx0)*i/24,by+52);
  x.textAlign='left';
  // grid
  const items=[['WATER T.','94','\u00b0C',0],['CHARGE T.',(34+boost*0.7).toFixed(0),'\u00b0C',0],
   ['KNOCK','0.0','\u00b0',1],['VOLT','14.2','V',0],['RPM',rpm.toFixed(0),'',0],
   ['SPEED',spd,'km/h',0],['MAF',(rpm*0.028*(1+boost/14)).toFixed(1),'g/s',0],['F. RAIL',(38+boost*4.5).toFixed(0),'bar',0],
   ['IAT','27','\u00b0C',0],['TRIM','+1.5','%',0],
   ['LOAD',Math.min(99,(boost/21*88+11)).toFixed(0),'%',0],['IGN ADV',(rpm>3000?(28-boost*0.35):12).toFixed(1),'\u00b0',0],
   ['G METER',(rpm>2600?0.42:0.05).toFixed(2),'g',0],['EXT. T','19','\u00b0C',0],['GEAR',gear,'',0]];
  const cols=5,rows=3,gg=12,gy=288,cw=(960-40-(cols-1)*gg)/cols,ch=(544-gy-2*gg-10)/rows;
  let k=0;
  for(let r=0;r<rows;r++)for(let c2=0;c2<cols;c2++){
    const bx=20+c2*(cw+gg),byy=gy+r*(ch+gg);
    x.fillStyle=DARK;rr(bx,byy,cw,ch,10);x.fill();
    x.strokeStyle='#2d2d32';x.lineWidth=2;rr(bx,byy,cw,ch,10);x.stroke();
    const it=items[k++];
    if(it[3]){x.fillStyle=RED;rr(bx,byy,6,ch,3);x.fill();}
    ital(17,'bold italic');x.fillStyle=CYAN;x.textAlign='center';
    x.fillText(it[0],bx+cw/2,byy+22);
    ital(42,'bold italic');x.fillStyle=WHITE;
    const vw=x.measureText(it[1]).width;
    ital(17,'italic');const uw=it[2]?x.measureText(it[2]).width+7:0;
    const gx0=bx+(cw-vw-uw)/2;
    ital(42,'bold italic');x.textAlign='left';x.fillText(it[1],gx0,byy+ch-16);
    if(it[2]){ital(17,'italic');x.fillStyle=GREY;x.fillText(it[2],gx0+vw+7,byy+ch-16);}
    x.textAlign='left';
  }
  requestAnimationFrame(frame);
}
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
requestAnimationFrame(frame);
